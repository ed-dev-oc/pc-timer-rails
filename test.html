<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Client Mode - Internet Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0b1220;
      color: #e5e7eb;
      height: 100vh;
      overflow: hidden;
    }

    .center-box {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 30px;
      width: 420px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    .big-time {
      font-size: 2.8rem;
      font-weight: bold;
      color: #22c55e;
    }

    .locked {
      color: #ef4444;
      font-weight: bold;
    }

    .btn-kiosk {
      width: 100%;
      padding: 12px;
      font-weight: 600;
    }

    .warning {
      color: #fbbf24;
    }
  </style>
</head>

<body>

<div class="center-box">

  <div class="glass-card">

    <h3>💻 Internet Café Session</h3>
    <p class="locked">🔒 PC is LOCKED</p>

    <hr>

    <p>🖥️ PC Name: <strong>PC-07</strong></p>
    <p>👤 User: Guest Session</p>

    <hr>

    <div>
      <p>⏳ Remaining Time</p>
      <div class="big-time">00:14:28</div>
    </div>

    <hr>

    <p>💰 Balance: <strong>₱25.00</strong></p>
    <p class="warning">⚠ Insert coin to continue session</p>

    <div class="progress mb-3">
      <div class="progress-bar bg-warning" style="width: 35%"></div>
    </div>

    <button class="btn btn-success btn-kiosk mb-2">
      💵 Insert Coin
    </button>

    <button class="btn btn-primary btn-kiosk mb-2">
      📩 Request Staff Assistance
    </button>

    <button class="btn btn-danger btn-kiosk">
      🚪 Exit / Logout
    </button>

    <hr>

    <small class="text-secondary">
      System will auto-lock when time expires
    </small>

  </div>

</div>

</body>
</html>
