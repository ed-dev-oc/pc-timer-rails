development:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  periodic_pc_status:
    class: "Pcs::StatusHeartbeatJob"
    queue: background
    schedule: every 2 minutes
  periodic_coin_slot_status:
    class: "CoinSlots::StatusHeartbeatJob"
    queue: background
    schedule: every 2 minutes

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  periodic_pc_status:
    class: "Pcs::StatusHeartbeatJob"
    queue: background
    schedule: every two minutes
  periodic_coin_slot_status:
    class: "CoinSlots::StatusHeartbeatJob"
    queue: background
    schedule: every two minutes